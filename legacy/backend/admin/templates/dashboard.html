<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordToFlush Admin - 控制面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .topbar {
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h1 { font-size: 18px; color: #ff6b6b; }
    .topbar .logout { color: #888; cursor: pointer; font-size: 13px; }
    .topbar .logout:hover { color: #ff6b6b; }
    .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 20px;
    }
    .card h2 { font-size: 15px; color: #ccc; margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-row input, .form-row select {
      padding: 8px 10px;
      background: #0f0f1a; border: 1px solid #2a2a4a;
      border-radius: 6px; color: #e0e0e0; font-size: 13px;
      outline: none; flex: 1; min-width: 100px;
    }
    .form-row input:focus, .form-row select:focus { border-color: #ff6b6b; }
    .btn {
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer; font-weight: 600;
    }
    .btn-start { background: #27ae60; color: #fff; }
    .btn-start:hover { background: #219a52; }
    .btn-start:disabled { background: #1a3a2a; color: #555; cursor: not-allowed; }
    .btn-stop { background: #e74c3c; color: #fff; }
    .btn-stop:hover { background: #c0392b; }
    .btn-toggle { background: #2a2a4a; color: #ccc; }
    .btn-toggle.active { background: #27ae60; color: #fff; }
    .status-row {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;
    }
    .status-badge {
      padding: 4px 10px; border-radius: 4px; font-size: 12px;
      background: #2a2a4a;
    }
    .status-badge.running { background: #1a3a1a; color: #4cd964; }
    .status-badge.stopped { background: #3a1a1a; color: #e74c3c; }
    .danmaku-log {
      grid-column: 1 / -1;
      max-height: 500px;
      overflow-y: auto;
    }
    .danmaku-item {
      padding: 8px 12px;
      border-bottom: 1px solid #2a2a4a;
      display: flex; gap: 10px; align-items: center;
      font-size: 13px;
    }
    .danmaku-item:hover { background: #1f1f3a; }
    .danmaku-platform {
      padding: 2px 6px; border-radius: 3px; font-size: 11px;
      font-weight: 600; flex-shrink: 0; min-width: 50px; text-align: center;
    }
    .platform-douyin { background: #1a1a1a; color: #ff4d4f; }
    .platform-bilibili { background: #1a1a2e; color: #00a1d6; }
    .danmaku-user { color: #ff6b6b; flex-shrink: 0; min-width: 80px; text-align: right; }
    .danmaku-content { color: #e0e0e0; word-break: break-all; }
    .danmaku-time { color: #666; font-size: 11px; flex-shrink: 0; }
    .empty { text-align: center; color: #666; padding: 40px; }
    .auto-guess-ctrl { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>WordToFlush Admin 控制面板</h1>
    <span class="logout" onclick="doLogout()">退出登录</span>
  </div>

  <div class="container">
    <div class="card" style="margin-bottom: 20px;">
      <h2>自动猜词</h2>
      <div class="auto-guess-ctrl">
        <button class="btn btn-toggle active" id="autoGuessBtn" onclick="toggleAutoGuess()">自动猜词: 开</button>
        <span style="color:#888;font-size:12px;">弹幕内容自动作为猜测词送入游戏管线（字数不符的由后端自动过滤）</span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>抖音 弹幕源</h2>
        <div class="form-row">
          <input type="text" id="dyRoom" placeholder="抖音直播间号">
          <button class="btn btn-start" id="dyStartBtn" onclick="startCollect('douyin')">开始采集</button>
          <button class="btn btn-stop" onclick="stopCollect('douyin')">停止</button>
        </div>
        <div class="status-row" id="dyStatus">
          <span class="status-badge stopped">未启动</span>
        </div>
      </div>

      <div class="card">
        <h2>B站 弹幕源</h2>
        <div class="form-row">
          <input type="text" id="biliRoom" placeholder="B站直播间号">
          <button class="btn btn-start" id="biliStartBtn" onclick="startCollect('bilibili')">开始采集</button>
          <button class="btn btn-stop" onclick="stopCollect('bilibili')">停止</button>
        </div>
        <div class="status-row" id="biliStatus">
          <span class="status-badge stopped">未启动</span>
        </div>
      </div>

      <div class="card danmaku-log">
        <h2>实时弹幕流</h2>
        <div id="danmakuList">
          <div class="empty">等待弹幕...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SSE_URL = '/api/danmaku/stream';
    let eventSource = null;
    let autoGuessEnabled = true;

    function startSSE() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource(SSE_URL);
      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          appendDanmaku(data);
        } catch (err) {}
      };
      eventSource.onerror = () => {
        setTimeout(startSSE, 3000);
      };
    }

    function appendDanmaku(data) {
      const list = document.getElementById('danmakuList');
      const empty = list.querySelector('.empty');
      if (empty) empty.remove();

      const div = document.createElement('div');
      div.className = 'danmaku-item';
      const platformClass = data.platform === 'douyin' ? 'platform-douyin' : 'platform-bilibili';
      const platformName = data.platform === 'douyin' ? '抖音' : 'B站';
      const time = new Date(data.timestamp).toLocaleTimeString('zh-CN');

      div.innerHTML = `
        <span class="danmaku-platform ${platformClass}">${platformName}</span>
        <span class="danmaku-user">${escapeHtml(data.userName)}</span>
        <span class="danmaku-content">${escapeHtml(data.content)}</span>
        <span class="danmaku-time">${time}</span>
      `;
      list.insertBefore(div, list.firstChild);

      while (list.children.length > 100) {
        list.removeChild(list.lastChild);
      }
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    async function startCollect(platform) {
      const roomId = platform === 'douyin'
        ? document.getElementById('dyRoom').value.trim()
        : document.getElementById('biliRoom').value.trim();
      if (!roomId) return alert('请输入房间号');

      setButtonsDisabled(platform, true);

      fetch('/api/danmaku/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ platform, room: roomId }),
      }).then(resp => resp.json()).then(data => {
        if (data.ok) {
          updateStatus(platform, 'running', '采集中');
        } else {
          alert('启动失败: ' + (data.error || '未知错误'));
          updateStatus(platform, 'stopped', '失败: ' + (data.error || ''));
          setButtonsDisabled(platform, false);
        }
      }).catch(() => {
        setButtonsDisabled(platform, false);
      });
    }

    async function stopCollect(platform) {
      const roomId = platform === 'douyin'
        ? document.getElementById('dyRoom').value.trim()
        : document.getElementById('biliRoom').value.trim();
      if (!roomId) return;

      setButtonsDisabled(platform, true);
      try {
        const resp = await fetch('/api/danmaku/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ platform, room: roomId }),
        });
        const data = await resp.json();
        if (data.ok) {
          updateStatus(platform, 'stopped', '已停止');
        }
      } catch (err) {
        updateStatus(platform, 'stopped', '已停止');
      }
      setButtonsDisabled(platform, false);
    }

    function updateStatus(platform, cls, text) {
      const el = platform === 'douyin'
        ? document.getElementById('dyStatus')
        : document.getElementById('biliStatus');
      el.innerHTML = `<span class="status-badge ${cls}">${text}</span>`;
    }

    function setButtonsDisabled(platform, disabled) {
      const btn = platform === 'douyin'
        ? document.getElementById('dyStartBtn')
        : document.getElementById('biliStartBtn');
      const input = platform === 'douyin'
        ? document.getElementById('dyRoom')
        : document.getElementById('biliRoom');
      btn.disabled = disabled;
      input.disabled = disabled;
    }

    async function toggleAutoGuess() {
      autoGuessEnabled = !autoGuessEnabled;
      const btn = document.getElementById('autoGuessBtn');
      btn.textContent = '自动猜词: ' + (autoGuessEnabled ? '开' : '关');
      btn.className = 'btn btn-toggle' + (autoGuessEnabled ? ' active' : '');

      await fetch('/api/auto-guess', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: autoGuessEnabled }),
      });
    }

    async function doLogout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    async function refreshStatus() {
      try {
        const resp = await fetch('/api/status');
        const data = await resp.json();
        const seenPlatforms = new Set();
        for (const c of data.collectors) {
          seenPlatforms.add(c.platform);
          const text = c.running
            ? (c.connected ? '已连接' : '重连中...')
            : c.error ? '错误: ' + c.error : '已停止';
          const cls = c.running ? (c.connected ? 'running' : 'stopped') : 'stopped';
          updateStatus(c.platform, cls, text);
          setButtonsDisabled(c.platform, c.running);
        }
        if (!seenPlatforms.has('douyin')) setButtonsDisabled('douyin', false);
        if (!seenPlatforms.has('bilibili')) setButtonsDisabled('bilibili', false);
        if (data.autoGuess) {
          autoGuessEnabled = data.autoGuess.enabled;
          const btn = document.getElementById('autoGuessBtn');
          btn.textContent = '自动猜词: ' + (autoGuessEnabled ? '开' : '关');
          btn.className = 'btn btn-toggle' + (autoGuessEnabled ? ' active' : '');
        }
      } catch (err) {}
    }

    startSSE();
    setInterval(refreshStatus, 5000);
    refreshStatus();
  </script>
</body>
</html>
